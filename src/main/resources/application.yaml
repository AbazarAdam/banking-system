# ─────────────────────────────────────────────────────────────────────────────
# application.yaml
spring:
  application:
    name: Banking-System
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banking_db?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

cors:
  allowed-origins: ${ALLOWED_ORIGIN:http://localhost:5173}

logging:
  level:
    org.springframework.security: INFO
    com.bankingsystem: DEBUG
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
